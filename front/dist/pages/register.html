<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - Biblionline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../css/auth.css" rel="stylesheet">
</head>

<body class="pagina-auth">
    <a href="../../landing.html" class="auth-volver"><i class="bi bi-arrow-left"></i> Volver</a>

    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="../img/logo.png" onerror="this.onerror=null;this.src='../img/logo.ico'" alt="Biblionline" class="auth-logo mb-2">
            <h1 class="auth-titulo mb-0">Crear cuenta</h1>
        </div>

        <div id="alerta" class="alert d-none py-2 small" role="alert"></div>

        <form id="form-registro" novalidate>
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" type="text" class="form-control" maxlength="60" required autocomplete="given-name">
                </div>
                <div class="col-6">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input id="apellido" type="text" class="form-control" maxlength="60" required autocomplete="family-name">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" maxlength="120" required autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña <span class="text-muted fw-normal">(mínimo 8 caracteres)</span></label>
                <input id="password" type="password" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
            <div class="mb-4">
                <label for="password2" class="form-label">Repetir contraseña</label>
                <input id="password2" type="password" class="form-control" minlength="8" required autocomplete="new-password">
            </div>

            <button type="submit" id="btn-enviar" class="btn btn-primary btn-auth w-100">Crear cuenta</button>
        </form>

        <p class="auth-pie text-center mt-4 mb-0">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const alerta = document.getElementById('alerta');
        function mostrarAlerta(msg, tipo = 'danger') {
            alerta.className = 'alert alert-' + tipo + ' py-2 small';
            alerta.textContent = msg;
        }

        API.sesion().then(r => { if (r.logueado) location.href = r.destino; });

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                password2: document.getElementById('password2').value
            };
            if (Object.values(datos).some(v => !v)) return mostrarAlerta('Completá todos los campos.');
            if (datos.password.length < 8) return mostrarAlerta('La contraseña debe tener al menos 8 caracteres.');
            if (datos.password !== datos.password2) return mostrarAlerta('Las contraseñas no coinciden.');

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            const r = await API.register(datos);
            if (r.status === 'success') {
                mostrarAlerta('¡Cuenta creada! Redirigiendo...', 'success');
                setTimeout(() => location.href = r.data.redirect, 700);
            } else {
                mostrarAlerta(r.message || 'No se pudo crear la cuenta.');
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
